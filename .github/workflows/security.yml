name: Security Scan

on:
  push:
    branches: [main, '001-helixplay-system']
  pull_request:
    branches: [main, '001-helixplay-system']
  schedule:
    - cron: '0 3 1 * *'  # Monthly at 3 AM on 1st

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: go work sync
      - run: govulncheck ./...

  snyk:
    name: Snyk Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
      - name: Skip Snyk (no token)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "SNYK_TOKEN not configured; skipping Snyk scan"

  trivy:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          skip-dirs: 'Catalogizer,Challenges,Assets,Auth,Auth-Context-React,Cache,Catalogizer-API-Client-TS,Collection-Manager-React,Concurrency,Config,Containers,Dashboard-Analytics-React,Database,Discovery,DocProcessor,Entities,EventBus,Filesystem,Formatters,HelixQA,LLMOrchestrator,LLMProvider,Lazy,Media,Media-Browser-React,Media-Player-React,Media-Types-TS,Memory,Messaging,Middleware,Observability,Plugins,RAG,RateLimiter,Recovery,ReplayBuffer,ScreenDiff,Security,Storage,Streaming,TrainingCollector,UI-Components-React,VectorDB,VisionEngine,VisualRegression,Watcher,WebSocket-Client-TS'
