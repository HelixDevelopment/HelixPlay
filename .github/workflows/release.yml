name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/helixplay-host-agent-linux-amd64 ./cmd/host-agent
          GOOS=linux GOARCH=arm64 go build -o dist/helixplay-host-agent-linux-arm64 ./cmd/host-agent
          GOOS=darwin GOARCH=amd64 go build -o dist/helixplay-host-agent-darwin-amd64 ./cmd/host-agent
          GOOS=darwin GOARCH=arm64 go build -o dist/helixplay-host-agent-darwin-arm64 ./cmd/host-agent
          GOOS=windows GOARCH=amd64 go build -o dist/helixplay-host-agent-windows-amd64.exe ./cmd/host-agent
          GOOS=linux GOARCH=amd64 go build -o dist/helixplay-backend-linux-amd64 ./cmd/core

      - name: Generate changelog
        run: |
          echo "## Changes" > CHANGELOG.md
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.md
          files: dist/*
          draft: false
          prerelease: false
