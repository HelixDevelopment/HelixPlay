name: Anti-Bluff Scan

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, '001-helixplay-system']

jobs:
  anti-bluff:
    name: Anti-Bluff Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'

      - name: Run anti-bluff scan
        run: bash scripts/anti-bluff-scan.sh
        timeout-minutes: 10

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check forbidden patterns in non-test code
        run: |
          # Fail on TODO/FIXME/XXX/HACK in non-test code
          if rg -n 'TODO|FIXME|XXX|HACK' --type go --type-not go-test -i; then
            echo "ERROR: Forbidden patterns found in non-test code"
            exit 1
          fi

      - name: Check empty function bodies
        run: |
          # Scan for actually empty single-line function bodies like func Foo() {}
          # Excludes generated protobuf, gRPC, Flutter binding files, test fixtures,
          # and submodules (each submodule has its own anti-bluff CI).
          SUBMODULE_DIRS="Auth,Auth-Context-React,Cache,Catalogizer,Catalogizer-API-Client-TS,Challenges,Collection-Manager-React,Concurrency,Config,Containers,Dashboard-Analytics-React,Database,Discovery,DocProcessor,Entities,EventBus,Filesystem,Formatters,HelixQA,LLMOrchestrator,LLMProvider,Lazy,Media,Media-Browser-React,Media-Player-React,Media-Types-TS,Memory,Messaging,Middleware,Observability,Plugins,RAG,RateLimiter,Recovery,ReplayBuffer,ScreenDiff,Security,Storage,Streaming,TrainingCollector,UI-Components-React,VectorDB,VisionEngine,VisualRegression,Watcher,WebSocket-Client-TS"
          IFS=',' read -ra SKIP <<< "$SUBMODULE_DIRS"
          FIND_OPTS=""
          for dir in "${SKIP[@]}"; do
            FIND_OPTS="$FIND_OPTS -not -path './$dir/*'"
          done

          FOUND=$(eval "find . -name '*.go' -not -path './vendor/*' -not -name '*_test.go' \
            -not -name '*.pb.go' -not -name '*_grpc.pb.go' -not -name 'bindings.go' \
            -not -name '*fixture*' -not -name '*stub*' $FIND_OPTS" | while read -r f; do
            if grep -n 'func.*{}$' "$f" | grep -vE 'Noop|NoOp|Mock|func main\(\)' >/dev/null 2>&1; then
              echo "$f"
            fi
          done)
          if [ -n "$FOUND" ]; then
            echo "ERROR: Empty single-line function bodies found:"
            echo "$FOUND"
            exit 1
          fi

      - name: Verify tests exercise real behavior
        run: |
          # Every test file must contain at least one non-trivial assertion
          # (not just constructor nil checks or assert.True(t, true))
          FAILED=0
          for f in $(find . -name '*_test.go' -not -path './vendor/*'); do
            # Check if file only has constructor tests (TestNew* with only nil checks)
            if grep -q "func TestNew" "$f" && ! grep -qE "(assert\.NotEqual|assert\.Equal|assert\.True\(t,.*[^)]+\)|require\.)" "$f"; then
              echo "ERROR: Constructor-only bluff test: $f"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi
