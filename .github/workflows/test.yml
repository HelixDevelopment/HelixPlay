name: Test Matrix

on:
  push:
    branches: [main, '001-helixplay-system']
  pull_request:
    branches: [main, '001-helixplay-system']
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Run unit tests
        run: go test -count=1 -race -p 1 ./cmd/... ./pkg/...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Run integration tests
        run: go test -count=1 -race -p 1 ./tests/integration/...

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Run E2E tests
        run: go test -count=1 -race -p 1 ./tests/e2e/...

  benchmark:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./tests/benchmark/... | tee benchmark.txt
      - name: Check benchmark results exist
        run: |
          if [ ! -s benchmark.txt ]; then
            echo "ERROR: No benchmark results produced"
            exit 1
          fi
          if grep -q "no tests to run" benchmark.txt; then
            echo "ERROR: No benchmarks found"
            exit 1
          fi

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Run security tests
        run: go test -count=1 -race -p 1 ./tests/security/...

  challenge:
    name: Challenge Scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - name: Run challenge scenarios
        run: go test -count=1 -race -p 1 -timeout=10m ./tests/challenges/...
