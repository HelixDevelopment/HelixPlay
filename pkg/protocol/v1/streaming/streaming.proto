syntax = "proto3";
package streaming.v1;

option go_package = "github.com/HelixDevelopment/HelixPlay/pkg/protocol/v1;streamingv1";

// StreamingControl manages capability negotiation and session lifecycle
service StreamingControl {
  // Bidirectional capability negotiation
  rpc NegotiateStream(stream NegotiateMessage) returns (stream NegotiateMessage);

  // Client telemetry push for ABR/congestion control
  rpc PushTelemetry(stream TelemetryPacket) returns (TelemetryAck);

  // Host quality-of-stream updates
  rpc StreamQualityUpdates(StreamQualityRequest) returns (stream QualityUpdate);

  // Health check
  rpc Health(HealthRequest) returns (HealthResponse);
}

message NegotiateMessage {
  oneof payload {
    ClientHello client_hello = 1;
    HostAdvertisement host_advertisement = 2;
    ClientOffer client_offer = 3;
    HostAnswer host_answer = 4;
    ICECandidate ice_candidate = 5;
    Ready ready = 6;
    Renegotiate renegotiate = 7;
    Terminate terminate = 8;
    Error error = 9;
  }
}

message ClientHello {
  string protocol_version = 1;
  string client_id = 2;
  string user_id = 3;
  string auth_token = 4;
  string requested_game_id = 5;
}

message HostAdvertisement {
  string host_id = 1;
  repeated GPUEntry gpu_entries = 2;
  repeated string codecs = 3;
  repeated string transports = 4;
  Resolution max_resolution = 5;
  int32 max_refresh_rate = 6;
  repeated string hdr_formats = 7;
  int32 thermal_headroom_pct = 8;
}

message GPUEntry {
  int32 index = 1;
  string vendor = 2;
  string model = 3;
  string encoder = 4;
  repeated string codecs = 5;
  int32 vram_gb = 6;
}

message ClientOffer {
  string preferred_codec = 1;
  repeated string fallback_codecs = 2;
  string preferred_transport = 3;
  DisplayCaps display_caps = 4;
  DecoderCaps decoder_caps = 5;
  NetworkCaps network_caps = 6;
  AudioCaps audio_caps = 7;
  ControllerCaps controller_caps = 8;
}

message HostAnswer {
  string selected_codec = 1;
  string selected_transport = 2;
  int32 selected_gpu_index = 3;
  Resolution resolution = 4;
  int32 refresh_rate = 5;
  int32 bitrate_target_kbps = 6;
  string hdr_mode = 7;
  SRTPParams srtp_parameters = 8;
  QUICConfig quic_config = 9;
  UDPConfig udp_config = 10;
}

message ICECandidate {
  string sdp_mid = 1;
  int32 sdp_mline_index = 2;
  string candidate = 3;
}

message Ready {
  string session_id = 1;
  int32 ssrc = 2;
  int32 payload_type = 3;
}

message Renegotiate {
  string reason = 1;
  ClientOffer new_offer = 2;
}

message Terminate {
  string reason = 1;
}

message Error {
  string code = 1;
  string message = 2;
}

message Resolution {
  int32 width = 1;
  int32 height = 2;
}

message DisplayCaps {
  int32 width = 1;
  int32 height = 2;
  int32 refresh_hz = 3;
  bool hdr_supported = 4;
}

message DecoderCaps {
  repeated string hardware_decoders = 1;
  map<string, Resolution> max_resolution_per_codec = 2;
}

message NetworkCaps {
  int32 max_bandwidth_mbps = 1;
  bool supports_bbr = 2;
  int32 rtt_ms_estimate = 3;
}

message AudioCaps {
  repeated string codecs = 1;
  int32 max_channels = 2;
  int32 preferred_bitrate_kbps = 3;
}

message ControllerCaps {
  repeated string types = 1;
  bool haptic = 2;
  bool trigger = 3;
  bool gyro = 4;
  bool audio_jack = 5;
}

message SRTPParams {
  bytes key = 1;
  bytes salt = 2;
}

message QUICConfig {
  string alpn = 1;
  bytes zero_rtt_token = 2;
}

message UDPConfig {
  string dtls_fingerprint = 1;
  int32 port = 2;
}

message TelemetryPacket {
  string session_id = 1;
  int64 timestamp_ns = 2;
  VideoTelemetry video = 3;
  NetworkTelemetry network = 4;
  InputTelemetry input = 5;
  DisplayTelemetry display = 6;
}

message VideoTelemetry {
  int32 frames_received = 1;
  int32 frames_decoded = 2;
  int32 frames_dropped = 3;
  float decode_time_ms = 4;
}

message NetworkTelemetry {
  float bandwidth_estimate_mbps = 1;
  float rtt_ms = 2;
  float jitter_ms = 3;
  float packet_loss_pct = 4;
  int32 fec_recoveries = 5;
}

message InputTelemetry {
  int32 controller_events = 1;
  float latency_us_avg = 2;
}

message DisplayTelemetry {
  float actual_hz = 1;
  float vsync_offset_ms = 2;
  int32 display_queue_depth = 3;
}

message TelemetryAck {
  int64 ack_sequence = 1;
  string host_action = 2;
  int32 target_bitrate_kbps = 3;
}

message StreamQualityRequest {
  string session_id = 1;
  string client_id = 2;
}

message QualityUpdate {
  string update_type = 1;
  int64 timestamp_ns = 2;
  map<string, string> details = 3;
}

message HealthRequest {
  string component = 1;
}

message HealthResponse {
  string status = 1;
  repeated HealthCheck checks = 2;
}

message HealthCheck {
  string name = 1;
  string status = 2;
  string detail = 3;
}
